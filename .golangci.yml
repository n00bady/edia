run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - unused        # finds unused funcs/vars
    - gosimple
    - ineffassign
    - errcheck
    - gofmt         # enforces formatting rules (reports diffs)
    - goimports
    - revive
  disable: []

issues:
  # optional: fail only on new issues in PRs
  # exclude-use-default: false

linters-settings:
  gofmt:
    simplify: true

exclude:
  - "generated|^vendor/"
  - "someFileOrPatternToIgnore"
