run:
  timeout: 5m
  skip-dirs:
    - third_party
    - builtin
    - examples

linters:
  enable:
    - staticcheck
    - gofmt
    - goimports

linters-settings:
  staticcheck:
    checks:
      - all
      - -SA1019

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

issues:
  exclude-use-default: false
  exclude-rules:
    - path: '(.+)\.go$'
      text: 'generated|^vendor/'
    - path: '(.+)\.go$'
      text: 'someFileOrPatternToIgnore'
