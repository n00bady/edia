name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint & formatting checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract GO version from go.mod
        id: go-version
        run: echo "version=$(grep '^go' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Compute GOMODCACHE
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> $GITHUB_ENV

      - name: Cache go build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Cache Go module download cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Install native deps (X11 + GL) 
        run: |
          sudo apt-get update 
          sudo apt-get install -y \
            libx11-dev \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxss-dev \
            xvfb

      - name: Ensure modules download
        run: go mod download

      - name: Check gofmt (no changes allowed)
        run: |
          set -e
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on the following files:"
            echo "$out"
            exit 1
          fi

      - name: Check goimports (optionally)
        run: |
          set -e
          if ! command -v goimports >/dev/null 2>&1; then
            go install golang.org/x/tools/cmd/goimports@latest
          fi
          out=$(goimports -l .)
          if [ -n "$out" ]; then
            echo "goimports needs to be run on the following files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint from source and run
        run: |
          set -e
          # Build golangci-lint with the Go version set by actions/setup-go, so it matches go.mod
          # Use @master for latest HEAD (includes v2 config support).
          # For stability, replace '@master' with a specific tag/commit that you have verified supports v2.
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          # Ensure the binary is found (GOBIN or GOPATH/bin)
          export GOBIN=$(go env GOPATH)/bin
          export PATH=$GOBIN:$PATH
          # Run the linter
          golangci-lint run --out-format=colored-line-number --timeout=5m

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Extract GO version from go.mod
        id: go-version
        run: echo "version=$(grep '^go' go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Compute GOMODCACHE
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> $GITHUB_ENV

      - name: Cache go build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Cache Go module download cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Setup locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8 
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LC=en_US.UTF-8" >> $GITHUB_ENV

      - name: Install native deps (X11 + GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libxi-dev \
            libxcursor-dev \
            libx11-dev \
            libxinerama-dev \
            libxss-dev \
            pkg-config \
            xvfb

      - name: Install dependencies & run tests
        run: |
          go mod download
          go test ./... -v
